name: dicom_flutter_radiology_kit
description: >-
  Drop-in medical imaging kit for Flutter Web & Desktop featuring WADO-RS streaming,
  Web Worker WASM decoding, dynamic 16-bit scalar VOI LUT rendering, and clinical viewports.
version: 0.0.0
homepage: https://github.com/gosmart-health/dicom_flutter_radiology_kit

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  web: ^1.0.0
  typed_data: ^1.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - web/j2k_worker.js
    - web/openjpegwasm.js
    - web/openjpegwasm.wasm
