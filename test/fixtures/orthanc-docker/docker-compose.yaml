services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc-dicomweb
    restart: unless-stopped
    ports:
      - "4242:4242"   # DICOM C-STORE / C-FIND / C-MOVE protocol
      - "8042:8042"   # REST API, Orthanc Explorer & DICOMweb root
    environment:
      # General Orthanc Settings
      # Login via the browser is not required as this is a test environment.
      ORTHANC__NAME: "ORTHANC"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"

      # Register accepted remote modalities/AEs (use host.docker.internal to reach host machine)
      ORTHANC__DICOM_MODALITIES: >-
        {
          "MicronDicom": ["MDICOM", "host.docker.internal", 11113, "Generic"],
          "Weasis": ["WEASIS", "host.docker.internal", 11114, "Generic"],
          "GoSmart_SCP": ["GOSMART_SCP", "host.docker.internal", 11112, "Generic"]
        }

      # Enable DICOMweb Plugin
      DICOM_WEB_PLUGIN_ENABLED: "true"

      # DICOMweb Configuration
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__DICOM_WEB__ENABLE_WADO: "true"
      ORTHANC__DICOM_WEB__SERIES_METADATA: "Full"
      ORTHANC__DICOM_WEB__STUDIES_METADATA: "MainDicomTags"
      ORTHANC__DCMTK_TRANSCODER_ENABLED: "true"
      # Force Orthanc to respect custom Accept headers/transcoding over WADO-RS
      # ORTHANC__DICOM_WEB__HAS_WADO_RS_UNIVERSAL_TRANSFER_SYNTAX: "false"
      # Optional: Auto-load plugins if they aren't loading natively
      # ORTHANC__PLUGINS: "/usr/share/orthanc/plugins"

    volumes:
      - orthanc-db:/var/lib/orthanc/db

volumes:
  orthanc-db:
    driver: local
